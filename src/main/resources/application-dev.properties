#================== APP ==================
app.server.base-url=http://localhost:8080

#================== Swagger ==================
#-----with_dependency_enabled springdoc-openapi, UI available_at /swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

#================== DataBase ==================
spring.datasource.url=jdbc:mysql://localhost:3306/doc_multi_lang?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#-----connectionPool----
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.minimumIdle=2
spring.datasource.hikari.connectionTimeout=10000
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.maxLifetime=60000
spring.datasource.hikari.validationTimeout=5000

#================== JPA ==================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#================== Port ==================
server.port=8080

#================= Paths ==================
app.file-path=/var/appdata/files/

#============== Size =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

#====supported File Types / MIME types ====
file.allowed-extensions[0]=.pdf
file.allowed-extensions[1]=.png
#file.allowed-extensions[2]=.jpg
#file.allowed-extensions[3]=.jpeg

file.allowed-mime-types[0]=application/pdf
file.allowed-mime-types[1]=image/png
#file.allowed-mime-types[2]=image/jpeg