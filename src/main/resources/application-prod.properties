#================== APP ==================
app.server.base-url=https://docs.center.beer

#================== DataBase ==================
spring.datasource.url=jdbc:mysql://docs_mysql:3306/docs?serverTimezone=Europe/Moscow&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#================== JPA ==================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Moscow

#================== Port ==================
server.port=8080

#================= Paths ==================
app.file-path=/var/appdata/files/

#============== Size =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

#====supported File Types / MIME types ====
file.allowed-extensions[0]=.pdf
file.allowed-extensions[1]=.png

file.allowed-mime-types[0]=application/pdf
file.allowed-mime-types[1]=image/png

#===trust in forwarded headers============
server.forward-headers-strategy=framework


